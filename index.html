<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./style.css">
    <meta charset="UTF-8">
    <title>Interactive To-Do List</title>
</head>

<body>
    <h1>To-Do List</h1>
    <div class="container">
        <div class="in">
            <div id="message" style="display: none; color: green; margin-bottom: 10px;"></div>
            <input type="text" id="taskInput" placeholder="Enter a task" autofocus>
            <button id="addTaskBtn">Add Task</button>
        </div>
        <div class="list">
            <ul id="taskList"></ul>
        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
